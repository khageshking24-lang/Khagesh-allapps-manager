<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexa CEO Elite | Khagesh</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.autotable.min.js"></script>
    <style>
        :root { --p: #0ea5e9; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui; margin: 0; padding: 0; transition: 0.2s; }
        body { background: var(--bg); color: var(--text); padding: 10px; padding-bottom: 80px; }

        .ceo-header { text-align: center; margin-bottom: 15px; padding: 20px; border-radius: 20px; background: linear-gradient(135deg, #0ea5e9, #38bdf8); color: white; position: relative; }
        .theme-toggle { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; }
        .ceo-name { font-size: 24px; font-weight: 800; border: none; background: transparent; color: white; text-align: center; width: 100%; outline: none; text-transform: uppercase; }
        .ceo-addr { font-size: 12px; opacity: 0.9; border: none; background: transparent; color: white; text-align: center; width: 100%; outline: none; }

        .glass-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .prog-bg { background: rgba(0,0,0,0.1); height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        [data-theme="dark"] .prog-bg { background: rgba(255,255,255,0.1); }
        .prog-fill { background: var(--p); height: 100%; width: 0%; border-radius: 5px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full { grid-column: span 2; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: var(--card); color: var(--text); }
        
        .main-btn { width: 100%; background: var(--p); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .wa-btn { background: #25d366; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; margin-top: 5px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); display: flex; border-top: 1px solid var(--border); height: 65px; z-index: 1000; }
        .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #94a3b8; }
        .tab.active { color: var(--p); border-top: 3px solid var(--p); }

        .panel { display: none; }
        .panel.active { display: block; }
        .ledger-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding: 15px 0; }
    </style>
</head>
<body data-theme="light">

<div class="ceo-header">
    <div class="theme-toggle" onclick="toggleTheme()">🌓</div>
    <input type="text" id="fName" class="ceo-name" value="KHAGESH" oninput="saveC()">
    <input type="text" id="fAddr" class="ceo-addr" value="Delhi, India | Founder Nexa AI" oninput="saveC()">
</div>

<div style="display:flex; gap:10px; margin-bottom:15px;">
    <button onclick="document.getElementById('imp').click()" style="flex:1; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-weight:bold;">📥 Import</button>
    <button onclick="safeExport()" id="exportBtn" style="flex:1; padding:12px; border-radius:12px; border:none; background:#0f172a; color:white; font-weight:bold;">📄 Export PDF</button>
    <input type="file" id="imp" hidden onchange="importData(event)">
</div>

<div id="Home" class="panel active">
    <div class="glass-card">
        <div style="display:flex; justify-content: space-between;">
            <span>Target: <b id="gVal">₹0</b></span>
            <span id="pVal" style="color:var(--p)">0%</span>
        </div>
        <div class="prog-bg"><div id="pBar" class="prog-fill"></div></div>
        <small onclick="setG()" style="opacity:0.6; font-size:10px;">Set Monthly Goal (Click)</small>
    </div>

    <div class="glass-card">
        <h4 style="margin-bottom:12px; color:var(--p)">Record Business Sale</h4>
        <div class="form-grid">
            <input type="hidden" id="editId">
            <input type="text" id="cName" placeholder="Client Name" class="full">
            <input type="text" id="cLoc" placeholder="Client Address">
            <input type="text" id="cApp" placeholder="Software Sold">
            <input type="tel" id="cPhone" value="+91" placeholder="WhatsApp Number">
            <input type="number" id="cAmt" placeholder="Amount (₹)">
            <input type="date" id="cDate">
            <select id="cStatus" class="full">
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
            </select>
            <button id="addBtn" class="main-btn full" onclick="save()">SAVE RECORD 🚀</button>
        </div>
    </div>
</div>

<div id="Ledger" class="panel">
    <div class="glass-card">
        <input type="text" id="search" placeholder="Search by name, app or city..." oninput="render()" style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--border); margin-bottom:10px;">
        <div id="list"></div>
    </div>
</div>

<div class="tab-bar">
    <div class="tab active" onclick="tab('Home', this)"><span>🏠</span>HOME</div>
    <div class="tab" onclick="tab('Ledger', this)"><span>📑</span>LEDGER</div>
</div>

<script>
    let db, allData = [], goal = localStorage.getItem('nGoal') || 50000;
    
    // Storage & Theme
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
    if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

    function toggleTheme() {
        const mode = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', mode);
        localStorage.setItem('theme', mode);
    }

    // CEO Info
    document.getElementById('fName').value = localStorage.getItem('cN') || "KHAGESH";
    document.getElementById('fAddr').value = localStorage.getItem('cA') || "Delhi, India | Founder Nexa AI";
    function saveC(){ localStorage.setItem('cN', document.getElementById('fName').value); localStorage.setItem('cA', document.getElementById('fAddr').value); }

    // Permanent DB
    const req = indexedDB.open("Nexa_CEO_Elite_Permanent", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("sales", {keyPath:"id", autoIncrement:true});
    req.onsuccess = e => { db = e.target.result; load(); };

    function tab(id, el) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function save() {
        const id = document.getElementById('editId').value;
        const data = {
            name: document.getElementById('cName').value,
            addr: document.getElementById('cLoc').value,
            app: document.getElementById('cApp').value || 'Nexa Soft',
            phone: document.getElementById('cPhone').value,
            amt: parseFloat(document.getElementById('cAmt').value) || 0,
            date: document.getElementById('cDate').value,
            status: document.getElementById('cStatus').value
        };
        if(!data.name || data.phone.length < 12) return alert("Enter Name & Correct Phone (+91...)");
        const tx = db.transaction("sales", "readwrite");
        if(id) { data.id = parseInt(id); tx.objectStore("sales").put(data); } 
        else { tx.objectStore("sales").add(data); }
        tx.oncomplete = () => { load(); reset(); };
    }

    function load() {
        db.transaction("sales").objectStore("sales").getAll().onsuccess = e => {
            allData = e.target.result.reverse();
            render(); stats();
        };
    }

    function stats() {
        let p = 0; allData.forEach(i => { if(i.status === 'Paid') p += i.amt; });
        document.getElementById('gVal').innerText = `₹${goal}`;
        let perc = Math.min((p / goal) * 100, 100).toFixed(1);
        document.getElementById('pBar').style.width = perc + "%";
        document.getElementById('pVal').innerText = perc + "%";
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const list = document.getElementById('list');
        list.innerHTML = "";
        allData.filter(i => i.name.toLowerCase().includes(q) || i.app.toLowerCase().includes(q)).forEach(i => {
            const div = document.createElement('div');
            div.className = "ledger-item";
            div.innerHTML = `
                <div>
                    <b>${i.name}</b> <small style="color:var(--p)">(${i.app})</small><br>
                    <small style="opacity:0.6">${i.addr} | ${i.date}</small><br>
                    <button class="wa-btn" onclick="wa(${i.id})">💬 WhatsApp</button>
                </div>
                <div style="text-align:right">
                    <span style="color:${i.status==='Paid'?'#16a34a':'#d97706'}; font-weight:800;">₹${i.amt}</span><br>
                    <button style="border:none; background:none; color:var(--p); font-size:11px;" onclick="edit(${i.id})">Edit</button> | 
                    <button style="border:none; background:none; color:red; font-size:11px;" onclick="del(${i.id})">Del</button>
                </div>`;
            list.appendChild(div);
        });
    }

    function wa(id) {
        const i = allData.find(x => x.id === id);
        const msg = i.status === 'Paid' ? `Hello ${i.name}, payment of ₹${i.amt} for ${i.app} is received. Thank you! - Khagesh` : `Hello ${i.name}, reminder for ₹${i.amt} towards ${i.app}. Please pay.`;
        window.open(`https://wa.me/${i.phone.replace('+','')}/?text=${encodeURIComponent(msg)}`);
    }

    function edit(id) {
        const item = allData.find(i => i.id === id);
        document.getElementById('editId').value = item.id;
        document.getElementById('cName').value = item.name;
        document.getElementById('cLoc').value = item.addr;
        document.getElementById('cApp').value = item.app;
        document.getElementById('cPhone').value = item.phone;
        document.getElementById('cAmt').value = item.amt;
        document.getElementById('cDate').value = item.date;
        document.getElementById('cStatus').value = item.status;
        document.getElementById('addBtn').innerText = "UPDATE RECORD ⚡";
        tab('Home', document.querySelectorAll('.tab')[0]);
    }

    function del(id) { if(confirm("Delete?")) db.transaction("sales","readwrite").objectStore("sales").delete(id).oncomplete = load; }

    // THE FIXED EXPORT ENGINE
    async function safeExport() {
        const btn = document.getElementById('exportBtn');
        btn.innerText = "⏳ Processing...";
        
        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const fN = document.getElementById('fName').value;
            const fA = document.getElementById('fAddr').value;

            // Branding Header
            doc.setFontSize(22); doc.setTextColor(14, 165, 233); doc.text(fN, 14, 20);
            doc.setFontSize(10); doc.setTextColor(100); doc.text(fA, 14, 26);
            doc.line(14, 30, 196, 30);

            let earned = 0;
            const rows = allData.map(i => {
                if(i.status === 'Paid') earned += i.amt;
                return [i.date, i.name, i.addr, i.app, i.status, `Rs. ${i.amt}`];
            });

            doc.autoTable({
                startY: 35,
                head: [['Date', 'Client', 'Address', 'App', 'Status', 'Amount']],
                body: rows,
                headStyles: { fillColor: [14, 165, 233] },
                styles: { fontSize: 9 }
            });

            doc.setFontSize(14); doc.setTextColor(22, 163, 74);
            doc.text(`TOTAL EARNINGS: Rs. ${earned}`, 14, doc.lastAutoTable.finalY + 15);
            doc.save(`${fN}_Business_Report.pdf`);
            
        } catch (err) {
            alert("Export Error: Please ensure you are online to load PDF libraries.");
            console.error(err);
        } finally {
            btn.innerText = "📄 Export PDF";
        }
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = ev => {
            const data = JSON.parse(ev.target.result);
            const tx = db.transaction("sales", "readwrite");
            data.forEach(i => { delete i.id; tx.objectStore("sales").add(i); });
            tx.oncomplete = () => { load(); alert("Success: Data Restored!"); };
        };
        reader.readAsText(e.target.files[0]);
    }

    function setG() { let g = prompt("Target (₹):", goal); if(g) { goal = g; localStorage.setItem('nGoal', g); stats(); } }
    function reset() { 
        ['editId','cName','cLoc','cApp','cAmt'].forEach(id => document.getElementById(id).value = "");
        document.getElementById('cPhone').value = "+91";
        document.getElementById('addBtn').innerText = "SAVE RECORD 🚀";
        document.getElementById('cDate').valueAsDate = new Date();
    }
    document.getElementById('cDate').valueAsDate = new Date();
</script>
</body>
    </html>
