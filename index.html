<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Founder PRO | Target Tracker</title>
    <style>
        :root { --bg: #020617; --card: #1e293b; --accent: #38bdf8; --success: #22c55e; --text: #f1f5f9; }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; }
        
        /* Target Section */
        .target-box { padding: 20px; margin-bottom: 20px; border-bottom: 3px solid var(--accent); }
        .progress-container { background: #334155; height: 12px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--success)); transition: 0.5s ease; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { padding: 15px; text-align: center; }
        .stat-val { font-size: 20px; font-weight: bold; display: block; color: var(--accent); }
        
        .form-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 15px; margin-bottom: 15px; }
        .full { grid-column: span 2; }
        input, select, button { padding: 12px; border-radius: 8px; border: none; background: #1e293b; color: white; border: 1px solid #334155; }
        button.main-btn { background: var(--accent); color: #020617; font-weight: 800; cursor: pointer; grid-column: span 2; }
        
        .list-container { display: flex; flex-direction: column; gap: 8px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px; font-size: 14px; }
        .search { width: 100%; margin-bottom: 15px; padding: 12px; background: transparent; border: 1px solid #334155; }
        #observer-trigger { height: 30px; }
    </style>
</head>
<body>

    <div class="header">
        <h3 style="margin:0">🚀 Nexa Founder PRO</h3>
        <div id="live-time" style="font-size: 12px; opacity: 0.7;"></div>
    </div>

    <div class="target-box glass">
        <div style="display:flex; justify-content: space-between;">
            <span>Monthly Goal: <b id="goal-text">₹0</b></span>
            <span id="percent-text">0%</span>
        </div>
        <div class="progress-container">
            <div id="p-bar" class="progress-bar"></div>
        </div>
        <button onclick="setGoal()" style="font-size:11px; padding:4px 8px; background:transparent; color:var(--accent); border:1px solid var(--accent)">Set New Target</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card glass"><span>Earned</span><span class="stat-val" style="color:var(--success)" id="total-earn">₹0</span></div>
        <div class="stat-card glass"><span>Pending</span><span class="stat-val" style="color:#fbbf24" id="total-pend">₹0</span></div>
    </div>

    <div class="form-group glass">
        <input type="text" id="cName" placeholder="Client Name" class="full">
        <input type="text" id="cState" placeholder="State/City">
        <input type="number" id="cAmt" placeholder="Amount">
        <select id="cStatus" class="full">
            <option value="Paid">Paid</option>
            <option value="Pending">Pending</option>
        </select>
        <button class="main-btn" onclick="addEntry()">Record Sale</button>
    </div>

    <input type="text" id="search" class="glass search" placeholder="Search by name or state..." oninput="render()">

    <div id="list" class="list-container"></div>
    <div id="observer-trigger"></div>

    <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button onclick="exportData()" style="font-size:12px">Backup Data</button>
        <button onclick="document.getElementById('imp').click()" style="font-size:12px">Restore</button>
        <input type="file" id="imp" hidden onchange="importData(event)">
    </div>

    <script>
        let db, allData = [], displayLimit = 15, currentGoal = localStorage.getItem('nexaGoal') || 50000;

        const req = indexedDB.open("NexaPersonalDB", 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore("sales", {keyPath: "id", autoIncrement: true});
        req.onsuccess = e => { 
            db = e.target.result; 
            if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
            load(); 
        };

        function setGoal() {
            let g = prompt("Enter your monthly target (₹):", currentGoal);
            if(g) { localStorage.setItem('nexaGoal', g); currentGoal = g; updateStats(); }
        }

        function addEntry() {
            const data = {
                name: document.getElementById('cName').value,
                state: document.getElementById('cState').value,
                amt: parseFloat(document.getElementById('cAmt').value) || 0,
                status: document.getElementById('cStatus').value,
                date: new Date().toLocaleDateString()
            };
            if(!data.name) return;
            const tx = db.transaction("sales", "readwrite");
            tx.objectStore("sales").add(data);
            tx.oncomplete = () => { load(); clear(); };
        }

        function load() {
            const tx = db.transaction("sales", "readonly");
            const req = tx.objectStore("sales").getAll();
            req.onsuccess = () => { allData = req.result.reverse(); render(); updateStats(); };
        }

        function updateStats() {
            let p = 0, d = 0;
            allData.forEach(i => i.status === 'Paid' ? p += i.amt : d += i.amt);
            document.getElementById('total-earn').innerText = `₹${p}`;
            document.getElementById('total-pend').innerText = `₹${d}`;
            document.getElementById('goal-text').innerText = `₹${currentGoal}`;
            
            let perc = Math.min((p / currentGoal) * 100, 100).toFixed(1);
            document.getElementById('p-bar').style.width = perc + "%";
            document.getElementById('percent-text').innerText = perc + "%";
        }

        function render() {
            const q = document.getElementById('search').value.toLowerCase();
            const list = document.getElementById('list');
            list.innerHTML = "";
            const filtered = allData.filter(i => i.name.toLowerCase().includes(q) || i.state.toLowerCase().includes(q));
            
            filtered.slice(0, displayLimit).forEach(i => {
                const div = document.createElement('div');
                div.className = "item glass";
                div.innerHTML = `
                    <div><b>${i.name}</b> <br><small>${i.state} | ${i.date}</small></div>
                    <div style="text-align:right">
                        <span style="color:${i.status === 'Paid' ? '#22c55e' : '#fbbf24'}">₹${i.amt}</span><br>
                        <small onclick="del(${i.id})" style="color:#f87171; cursor:pointer">Delete</small>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        const obs = new IntersectionObserver(ent => { if(ent[0].isIntersecting && displayLimit < allData.length) { displayLimit += 15; render(); } });
        obs.observe(document.getElementById('observer-trigger'));

        function del(id) { if(confirm("Remove this record?")) { db.transaction("sales","readwrite").objectStore("sales").delete(id).oncomplete = load; } }
        function clear() { ['cName','cState','cAmt'].forEach(id => document.getElementById(id).value = ""); }
        function exportData() {
            const blob = new Blob([JSON.stringify(allData)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `Nexa_Founder_Backup.json`; a.click();
        }
        function importData(e) {
            const reader = new FileReader();
            reader.onload = ev => {
                const data = JSON.parse(ev.target.result);
                const tx = db.transaction("sales", "readwrite");
                data.forEach(i => { delete i.id; tx.objectStore("sales").add(i); });
                tx.oncomplete = load;
            };
            reader.readAsText(e.target.files[0]);
        }
        setInterval(() => document.getElementById('live-time').innerText = new Date().toLocaleString(), 1000);
    </script>
</body>
</html>
